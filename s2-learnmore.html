<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />

  <!-- A-Frame + AR.js -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <!-- Preload only the loading GIF early -->
  <link rel="preload" href="assets/landscape-loading.gif" as="image">

  <!-- Preload AR images and UI -->
  <link rel="preload" href="learnmore/section2/s2-learn-more-1-1.png" as="image">
  <link rel="preload" href="learnmore/section2/s2-learn-more-1-2.png" as="image">
  <link rel="preload" href="learnmore/section2/s2-learn-more-1-3.png" as="image">
  <link rel="preload" href="learnmore/section2/s2-learn-more-2.png" as="image">
  <link rel="preload" href="assets/scan_marker.png" as="image">
  <link rel="preload" href="assets/exit-button.png" as="image">
  <link rel="preload" href="assets/bg-music.png" as="image">
  <link rel="preload" href="assets/gameplay-music.png" as="image">
  <link rel="preload" href="assets/next-button.png" as="image">
  <link rel="preload" href="assets/back-button.png" as="image">
  <link rel="preload" href="assets/activity-button.png" as="image">
  <link rel="preload" href="assets/s2-lm-home.png" as="image">
  <link rel="preload" href="assets/start-button.png" as="image">

  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    body.loading .hide-until-ready { display: none !important; }

    /* Loading overlay */
    #loadingScreen {
      position: fixed; inset: 0; background: #fbead1;
      display: flex; justify-content: center; align-items: center;
      z-index: 3000;
    }
    #loadingScreen img { width: 100%; height: auto; object-fit: contain; }

    /* Home screen overlay (transparent so camera shows behind) */
    #preLearnMore {
      position: fixed; inset: 0; background: transparent;
      display: none; flex-direction: column; justify-content: center; align-items: center;
      gap: 12px; z-index: 2500; pointer-events: auto;
    }

    #preLearnMore img#homeImageLM { width: 70%; max-width: 780px; height: auto; max-height: 55vh; object-fit: contain; display: block; }
    #preLearnMore img#startBtnLM { width: 38vw; max-width: 145px; height: auto; cursor: pointer; display: block; }

    /* Scan prompt overlay (only after Start) */
    #scanMarkerPrompt {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh; object-fit: contain; z-index: 2500; pointer-events: none;
      display: none;
    }

    /* Top controls (music + exit) */
    #musicIcons { position: fixed; top: 10px; left: 10px; display: flex; gap: 10px; z-index: 1001; }
    .music-icon { width: 55px; height: auto; cursor: pointer; }
    #exitButton { position: fixed; top: 10px; right: 10px; width: 55px; height: auto; z-index: 1001; cursor: pointer; }

    /* Bottom buttons dock (right aligned) */
    #navBtns {
      position: fixed;
      bottom: 2.5vh;
      right: 3.5vw;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.2vw;
      z-index: 1002;
      pointer-events: auto;
    }
    /* Shift nav */
    #navBtns.pull-left { right: 18vw; }
    #navBtns img {
      width: 40vw;
      max-width: 150px;
      height: auto;
      cursor: pointer;
    }
    #navBtns #backBtn { display: none; } /* hidden on page 1 */

    #activityButton { position: fixed; bottom: 10px; left: 10px; height: 55px; width: auto; z-index: 1002; cursor: pointer; display: block; }

    /* Ensure a-scene is the base layer */
    a-scene { position: absolute; top: 0; left: 0; z-index: 0; }
  </style>
</head>

<body class="loading">
  <!-- Loading: show only this GIF at start -->
  <div id="loadingScreen"><img src="assets/landscape-loading.gif" alt="Loading…"></div>

  <!-- Home screen (shown after loader) -->
  <div id="preLearnMore" aria-hidden="true">
    <img id="homeImageLM" src="assets/s2-lm-home.png" alt="Learn More Home"/>
    <img id="startBtnLM" src="assets/start-button.png" alt="Start"/>
  </div>

  <!-- Everything below is hidden until Start (via body.loading) -->
  <!-- Overlays -->
  <img id="scanMarkerPrompt" class="hide-until-ready" src="assets/scan_marker.png" alt="Scan the marker">

  <!-- Audio -->
  <audio id="bgMusic" class="hide-until-ready" loop src="sfx/bg-music.mp3"></audio>
  <audio id="clickSound" class="hide-until-ready" src="sfx/button-click.mp3"></audio>

  <!-- Top UI -->
  <div id="musicIcons" class="hide-until-ready">
    <img id="bgMusicIcon" class="music-icon" src="assets/bg-music.png" alt="BG Music">
    <img id="gameplayMusicIcon" class="music-icon" src="assets/gameplay-music.png" alt="Gameplay Audio">
  </div>
  <img id="exitButton" class="hide-until-ready" src="assets/exit-button.png" alt="Exit">

  <!-- Bottom UI -->
  <img id="activityButton" class="hide-until-ready" src="assets/activity-button.png" alt="Activity">
  <div id="navBtns" class="hide-until-ready">
    <img id="backBtn" src="assets/back-button.png" alt="Back">
    <img id="nextBtn" src="assets/next-button.png" alt="Next">
  </div>

  <!-- AR Scene -->
  <a-scene class="hide-until-ready" arjs embedded renderer="logarithmicDepthBuffer: true; colorManagement: true; physicallyCorrectLights: true;">
    <a-assets>

      <img id="learnMoreTex" src="learnmore/section2/s2-learn-more-1-1.png">
    </a-assets>

    <a-entity light="type: ambient; color: #ffffff; intensity: 1.0"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 1.0" position="1 2 1"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 0.5" position="-1 2 -1"></a-entity>

    <!-- Learn More marker -->
    <a-marker id="learnMoreMarker"
              type="pattern"
              url="models/marker/s2-learnmore.patt"
              emitevents="true"
              smooth="true"
              smoothCount="30"
              smoothTolerance="0.01"
              smoothThreshold="5">
      <a-plane id="learnMorePlane"
               position="0.5 0.01 0"
               rotation="-90 0 0"
               width="2.4" height="2.28"
               visible="false"
               material="shader: flat; color: #FFF; transparent:true; src: #learnMoreTex; side:double; alphaTest:0.01"
               ui-texture-correct>
      </a-plane>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // === sRGB + no tone mapping ===
    AFRAME.registerComponent('ui-texture-correct', {
      init: function () {
        const el = this.el;
        const apply = () => {
          const mesh = el.getObject3D('mesh');
          if (!mesh) return;
          const mat = mesh.material;
          if (mat && 'toneMapped' in mat) { mat.toneMapped = false; mat.needsUpdate = true; }
          if (mat && mat.map) {
            if (THREE.SRGBColorSpace) {
              if (mat.map.colorSpace !== THREE.SRGBColorSpace) mat.map.colorSpace = THREE.SRGBColorSpace;
            } else if (THREE.sRGBEncoding) {
              if (mat.map.encoding !== THREE.sRGBEncoding) mat.map.encoding = THREE.sRGBEncoding;
            }
            mat.map.needsUpdate = true;
          }
        };
        el.addEventListener('object3dset', apply);
        el.addEventListener('model-loaded', apply);
        el.addEventListener('materialtextureloaded', apply);
        setTimeout(apply, 0);
      }
    });

    // --- Element references
    const scanPrompt = document.getElementById('scanMarkerPrompt');
    const loader = document.getElementById('loadingScreen');
    const preLearnMore = document.getElementById('preLearnMore');
    const startBtnLM = document.getElementById('startBtnLM');

    const nextBtn = document.getElementById('nextBtn');
    const backBtn = document.getElementById('backBtn');
    const activityButton = document.getElementById('activityButton');
    const exitButton = document.getElementById('exitButton');
    const bgMusic = document.getElementById('bgMusic');
    const clickSound = document.getElementById('clickSound');
    const bgMusicIcon = document.getElementById('bgMusicIcon');
    const gameplayMusicIcon = document.getElementById('gameplayMusicIcon');
    const learnMoreMarker = document.getElementById('learnMoreMarker');
    const learnMorePlane = document.getElementById('learnMorePlane');
    const learnMoreTex = document.getElementById('learnMoreTex');

    let musicStarted = false;
    let hasScanned = false; // once true, keep scan overlay hidden
let appClosed = false; // when true, ignore AR events and keep audio stopped

    let page = 1;

    function playClick() { try { clickSound.currentTime = 0; clickSound.play().catch(()=>{}); } catch(e){} }

    // --- Loader control: min 1s, max 3s ---
    const LOADER_MIN_MS = 1000;
    const LOADER_MAX_MS = 3000;
    const loaderStart = Date.now();
    let revealed = false;

    function showHome() {
      if (loader) loader.style.display = 'none';
      if (preLearnMore) preLearnMore.style.display = 'flex';
      // Keep body.loading so the rest of the UI stays hidden until Start
    }
    function hardReveal() { if (!revealed) { revealed = true; showHome(); } }

    const hardCap = setTimeout(hardReveal, LOADER_MAX_MS);
    window.addEventListener('load', () => {
      const elapsed = Date.now() - loaderStart;
      const wait = Math.max(0, LOADER_MIN_MS - elapsed);
      setTimeout(() => { clearTimeout(hardCap); hardReveal(); }, wait);
    });

    // Fullscreen
    function enterFullscreen() {
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
      if (req) { try { req.call(el); } catch(e){} }
    }

    // Start button -> go fullscreen, reveal the rest, show scan prompt
    startBtnLM.addEventListener('click', () => {
      playClick();
      enterFullscreen();
      if (preLearnMore) preLearnMore.style.display = 'none';
      document.body.classList.remove('loading');
      if (typeof setButtons === 'function') setButtons(1);
      if (!hasScanned && scanPrompt) scanPrompt.style.display = 'block';
    });

    const PAGE2_HEIGHT_SCALE = 1.12;

    function adjustPlaneHeightToImage(src, scale = 1) {
      const img = new Image();
      img.onload = () => {
        const aspect = img.height / img.width; // h/w
        const w = parseFloat(learnMorePlane.getAttribute('width')) || 2.0; // keep width
        const h = w * aspect * scale;
        learnMorePlane.setAttribute('height', h.toFixed(4));
        learnMorePlane.emit('materialtextureloaded', {});
      };
      img.src = src;
    }

    const PAGE1_SRC = '#learnMoreTex';
    const PAGE2_SRC = 'learnmore/section2/s2-learn-more-1-2.png';
    const PAGE3_SRC = 'learnmore/section2/s2-learn-more-1-3.png';
    const PAGE4_SRC = 'learnmore/section2/s2-learn-more-2.png';
    const page1Height = parseFloat(learnMorePlane.getAttribute('height')) || 1.9;

    // Navigation
    function setNavPositionForPage(pageNum) {
      const nav = document.getElementById('navBtns');
      if (!nav) return;
      if (pageNum === 1 || pageNum === 4) { nav.classList.add('pull-left'); }
      else { nav.classList.remove('pull-left'); }
    }
    function setButtons(pageNum) {
      if (pageNum === 1) { backBtn.style.display = 'none'; nextBtn.style.display = 'block'; }
      else if (pageNum === 2 || pageNum === 3) { backBtn.style.display = 'block'; nextBtn.style.display = 'block'; }
      else if (pageNum === 4) { backBtn.style.display = 'block'; nextBtn.style.display = 'none'; }
      setNavPositionForPage(pageNum);
    }
    function goToPage1() {
      learnMorePlane.setAttribute('material', 'src', PAGE1_SRC);
      learnMorePlane.setAttribute('height', page1Height.toString());
      learnMorePlane.emit('materialtextureloaded', {});
      page = 1; setButtons(page);
    }
    function goToPage2() {
      learnMorePlane.setAttribute('material', 'src', PAGE2_SRC);
      learnMorePlane.setAttribute('height', page1Height.toString());
      learnMorePlane.emit('materialtextureloaded', {});
      page = 2; setButtons(page);
    }
    function goToPage3() {
      learnMorePlane.setAttribute('material', 'src', PAGE3_SRC);
      learnMorePlane.setAttribute('height', page1Height.toString());
      learnMorePlane.emit('materialtextureloaded', {});
      page = 3; setButtons(page);
    }
    function goToPage4() {
      learnMorePlane.setAttribute('material', 'src', PAGE4_SRC);
      learnMorePlane.setAttribute('height', page1Height.toString());
      learnMorePlane.emit('materialtextureloaded', {});
      page = 4; setButtons(page);
    }

    // Marker events
    learnMoreMarker.addEventListener('markerFound', () => {
      if (appClosed) { try { bgMusic.pause(); } catch(e){} return; }
      if (!hasScanned && scanPrompt) scanPrompt.style.display = 'none';
      hasScanned = true;

      // Request fullscreen
      const elem = document.documentElement;
      if (elem.requestFullscreen) { elem.requestFullscreen().catch(() => {}); }
      else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }
      else if (elem.msRequestFullscreen) { elem.msRequestFullscreen(); }

      // Start bg music quietly
      if (!musicStarted) {
        bgMusic.volume = 0.1;
        bgMusic.play().catch(() => {});
        musicStarted = true;
      }

      // Show the AR plane content
      learnMorePlane.setAttribute('visible', 'true');
      learnMorePlane.emit('materialtextureloaded', {});
      if (scanPrompt) scanPrompt.style.display = 'none';
    });

    learnMoreMarker.addEventListener('markerLost', () => {
      // Hide the AR plane to prevent ghosting. Do not re-show the scan overlay.
      learnMorePlane.setAttribute('visible', 'false');
    });

    // Bottom buttons
    activityButton.addEventListener('click', () => {
      playClick();
      window.location.href = 's2-activity.html';
    });

    nextBtn.addEventListener('click', () => {
      playClick();
      if (page === 1) {
        goToPage2();
      } else if (page === 2) {
        goToPage3();
      } else if (page === 3) {
        goToPage4();
      }
    });

    backBtn.addEventListener('click', () => {
      playClick();
      if (page === 4) {
        goToPage3();
      } else if (page === 3) {
        goToPage2();
      } else if (page === 2) {
        goToPage1();
      }
    });

    // Music icon toggles
    bgMusicIcon.addEventListener('click', () => {
      playClick();
      const isMuted = bgMusicIcon.src.includes('mute-bg-music.png');
      if (isMuted) { bgMusicIcon.src = 'assets/bg-music.png'; bgMusic.play().catch(()=>{}); }
      else { bgMusicIcon.src = 'assets/mute-bg-music.png'; bgMusic.pause(); }
    });
    gameplayMusicIcon.addEventListener('click', () => {
      playClick();
      const muted = gameplayMusicIcon.src.includes('mute-gameplay-music.png');
      gameplayMusicIcon.src = muted ? 'assets/gameplay-music.png' : 'assets/mute-gameplay-music.png';
    });

    // Exit resets state
    // Exit closes app: reset state, hide AR, show home, exit fullscreen
exitButton.addEventListener('click', () => {
  playClick();
  appClosed = true;
  // stop audio
  try { bgMusic.pause(); bgMusic.currentTime = 0; } catch(e){}
  try { clickSound.pause(); clickSound.currentTime = 0; } catch(e){}
  musicStarted = false;
  hasScanned = false;
  page = 1;

  // exit fullscreen
  const exitFS = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
  if (exitFS) { try { exitFS.call(document); } catch(e){} }

  // hide all UI and AR elements
  const hide = (sel) => { const el = document.querySelector(sel); if (el) el.style.display = 'none'; };
  hide('#loadingScreen');
  hide('#preLearnMore');
  hide('#scanMarkerPrompt');
  hide('#musicIcons');
  hide('#navBtns');
  hide('#activityButton');
  hide('#exitButton');

  // hide AR contents
  try { if (learnMorePlane) learnMorePlane.setAttribute('visible', 'false'); } catch(e){}
  const sceneEl = document.querySelector('a-scene');
  if (sceneEl) { sceneEl.style.display = 'none'; }

  // ensure all .hide-until-ready stay hidden
  document.body.classList.add('loading');

  // add a transparent blocker to guarantee a blank screen
  let blocker = document.getElementById('exitBlocker');
  if (!blocker) {
    blocker = document.createElement('div');
    blocker.id = 'exitBlocker';
    blocker.style.position = 'fixed';
    blocker.style.inset = '0';
    blocker.style.background = 'transparent';
    blocker.style.zIndex = '9999';
    document.body.appendChild(blocker);
  }
});
</script>
</body>
</html>
